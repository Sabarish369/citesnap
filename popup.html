<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CiteSnap</title>
  <style>
    :root {
      --bg: #fbfbfd;
      --header: rgba(251, 251, 253, 0.78);
      --dock: rgba(251, 251, 253, 0.82);
      --glass: rgba(251, 251, 253, 0.82);
      --ink: #111113;
      --ink-secondary: #6e6e73;
      --ink-tertiary: #98989f;
      --hairline: rgba(0, 0, 0, 0.055);
      --wash: rgba(0, 113, 227, 0.055);
      --hover-wash: rgba(0, 0, 0, 0.04);
      --pill: rgba(118, 118, 128, 0.12);
      --accent: #0071e3;
      --accent-soft: rgba(0, 113, 227, 0.12);
      --danger: #d92d20;
      --danger-soft: rgba(217, 45, 32, 0.09);
      --canvas: #ffffff;
      --pill-bg: rgba(118, 118, 128, 0.12);
      --pill-bg-hover: rgba(0, 113, 227, 0.12);
      --ease-apple: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-snappy: cubic-bezier(0.2, 0, 0, 1);
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-press: cubic-bezier(0.2, 0, 0, 1);
      --cta-bg: #111113;
      --cta-ink: #fbfbfd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0f;
        --header: rgba(13, 13, 15, 0.78);
        --dock: rgba(13, 13, 15, 0.84);
        --glass: rgba(13, 13, 15, 0.84);
        --ink: #f5f5f7;
        --ink-secondary: #a1a1a6;
        --ink-tertiary: #98989f;
        --hairline: rgba(255, 255, 255, 0.07);
        --wash: rgba(41, 151, 255, 0.09);
        --hover-wash: rgba(255, 255, 255, 0.06);
        --pill: rgba(118, 118, 128, 0.24);
        --pill-bg: rgba(118, 118, 128, 0.24);
        --pill-bg-hover: rgba(41, 151, 255, 0.16);
        --accent: #2997ff;
        --accent-soft: rgba(41, 151, 255, 0.16);
        --danger: #f97066;
        --danger-soft: rgba(249, 112, 102, 0.14);
        --canvas: #1c1c1e;
        --cta-bg: #f5f5f7;
        --cta-ink: #0d0d0f;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      min-height: 440px;
      max-height: 580px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Google Sans", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 440px;
      min-height: 440px;
      max-height: 580px;
      opacity: 0;
      transform: translateY(6px);
      animation: appEnter 260ms var(--ease-apple) forwards;
    }

    @keyframes appEnter { to { opacity: 1; transform: translateY(0); } }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 76px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 8px;
      background: var(--header);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-right: auto;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1;
      color: var(--ink);
      cursor: default;
      user-select: none;
      margin: 0;
    }

    .cite-word {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding-left: 11px;
    }

    .cite-quotes {
      position: absolute;
      left: 0;
      top: -3px;
      width: 10px;
      height: 10px;
      color: #B48A3E;
      overflow: visible;
    }

    .cite-quotes path {
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
      transform-box: fill-box;
      transform-origin: center;
    }

    .brand-lockup:hover .cite-quotes .q-first {
      transform: translate(-1.2px, -1px) rotate(-6deg);
    }

    .brand-lockup:hover .cite-quotes .q-second {
      transform: translate(0.8px, -1.5px) rotate(6deg);
    }

    .snap-word {
      color: var(--ink-secondary);
      font-weight: 500;
      transition: color 200ms ease;
    }

    .brand-lockup:hover .snap-word {
      color: #B48A3E;
    }

    .count-pill {
      color: var(--ink-secondary);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .ghost-action {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 550;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 180ms ease, background 180ms var(--ease-snappy), transform 120ms var(--ease-snappy);
    }

    .ghost-action:hover { color: var(--ink); background: var(--pill); }
    .ghost-action:active { transform: scale(0.96); }
    .ghost-action.danger:hover { color: var(--danger); background: rgba(217, 45, 32, 0.09); }
    .ghost-action .svg-icon { width: 14px; height: 14px; stroke-width: 1.5; }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .icon-btn svg { width: 15px; height: 15px; stroke-width: 1.5; }

    #clearBtn .svg-icon,
    #clearBtn svg {
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #clearBtn .trash-lid {
      transform-box: fill-box;
      transform-origin: 95% 85%;
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #clearBtn .trash-can {
      transform-box: fill-box;
      transform-origin: center bottom;
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #clearBtn:hover .trash-lid,
    #clearBtn:focus-visible .trash-lid {
      transform: translate(0.5px, -1.4px) rotate(22deg);
    }

    #clearBtn:hover .trash-can,
    #clearBtn:focus-visible .trash-can {
      transform: translateY(0.4px);
    }

    #clearBtn:active .trash-lid {
      transform: translate(0.2px, -0.5px) rotate(8deg);
    }

    /* 176px Expanding Search Pill + Right Minimalist Dropdown */
    .search-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 30px;
      flex-basis: 100%;
    }

    .search-pill {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      width: 176px;
      height: 30px;
      border-radius: 999px;
      background: var(--pill-bg);
      padding: 0 11px;
      flex-shrink: 0;
      transition:
        width 240ms var(--ease-spring),
        background-color 180ms var(--ease-press),
        box-shadow 180ms var(--ease-press);
    }

    .search-pill:focus-within {
      width: 100%;
      background: var(--canvas);
      box-shadow: 0 0 0 3px var(--accent-soft), inset 0 0 0 1px var(--accent);
    }

    .search-pill:focus-within .search-input {
      outline: none;
    }

    .search-icon {
      width: 13px;
      height: 13px;
      color: var(--ink-tertiary);
      flex-shrink: 0;
      margin-right: 6px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 12.5px;
      letter-spacing: -0.01em;
      padding: 0;
      min-width: 0;
    }

    .search-input::placeholder {
      color: var(--ink-tertiary);
    }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
    }

    /* Containerless Dropdown Wrapper */
    .collection-dropdown {
      position: relative;
      z-index: 30;
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      transition: opacity 150ms var(--ease-spring);
    }

    /* ONLY hide when the search input itself is focused, NOT when dropdown is clicked */
    .search-pill:focus-within + .collection-dropdown {
      opacity: 0;
      pointer-events: none;
    }

    .dropdown-trigger {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      height: 28px;
      max-width: 162px;
      padding: 0 8px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      transition:
        background-color 140ms var(--ease-press),
        color 140ms var(--ease-press),
        transform 100ms var(--ease-press);
    }

    .dropdown-trigger:hover,
    .collection-dropdown.is-open .dropdown-trigger {
      background: var(--pill-bg);
      color: var(--ink);
    }

    .dropdown-trigger:active {
      transform: scale(0.96);
    }

    .dropdown-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dropdown-chevron {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.65;
      flex-shrink: 0;
      transition: transform 180ms var(--ease-spring);
    }

    .collection-dropdown.is-open .dropdown-chevron {
      transform: rotate(180deg);
    }

    /* Floating Frosted Containerless Menu */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 100;
      min-width: 184px;
      max-width: 230px;
      max-height: 260px;
      overflow-y: auto;
      padding: 5px;
      border-radius: 14px;
      background: var(--canvas);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.16),
        0 0 0 0.5px var(--hairline);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px) scale(0.97);
      transform-origin: top right;
      pointer-events: none;
      transition:
        opacity 160ms var(--ease-spring),
        transform 180ms var(--ease-spring),
        visibility 0s linear 160ms;
    }

    .dropdown-menu::-webkit-scrollbar {
      width: 4px;
    }

    .dropdown-menu::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.25);
      border-radius: 999px;
    }

    .collection-dropdown.is-open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      transition:
        opacity 160ms var(--ease-spring),
        transform 180ms var(--ease-spring),
        visibility 0s;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ink);
      user-select: none;
      transition: background-color 120ms ease;
    }

    .dropdown-item:hover {
      background: var(--hover-wash);
    }

    .dropdown-item-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .dropdown-check {
      width: 12px;
      height: 12px;
      stroke: var(--accent);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      flex-shrink: 0;
    }

    .dropdown-item.is-active .dropdown-check {
      opacity: 1;
    }

    .dropdown-item.is-active .dropdown-item-name {
      color: var(--accent);
      font-weight: 600;
    }

    .dropdown-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dropdown-item-del {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-tertiary);
      font-size: 13px;
      line-height: 1;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 120ms ease, background-color 120ms ease, color 120ms ease;
    }

    .dropdown-item:hover .dropdown-item-del {
      opacity: 1;
    }

    .dropdown-item-del:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .dropdown-divider {
      height: 0.5px;
      background: var(--hairline);
      margin: 4px 6px;
    }

    .dropdown-new-btn {
      appearance: none;
      border: none;
      background: transparent;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      text-align: left;
      transition: background-color 120ms ease;
    }

    .dropdown-new-btn:hover {
      background: var(--hover-wash);
    }

    .dropdown-new-input {
      width: 100%;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: var(--pill-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      padding: 0 9px;
      outline: none;
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    /* Containerless Sticky Day-Wise History Header */
    .day-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 6px;
      margin-top: 6px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
    }

    .day-header:first-child {
      margin-top: 0;
    }

    .day-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .day-copy-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-tertiary);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(2px);
      transition:
        opacity 160ms var(--ease-spring),
        transform 160ms var(--ease-spring),
        background-color 150ms var(--ease-press),
        color 150ms var(--ease-press);
    }

    .day-header:hover .day-copy-btn,
    .day-header:focus-within .day-copy-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .day-copy-btn:hover {
      background: var(--pill-bg);
      color: #B48A3E;
    }

    .day-copy-btn:active {
      transform: scale(0.95);
    }

    .feed {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 10px 16px;
      mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
      scroll-behavior: smooth;
    }

    .feed::-webkit-scrollbar { width: 4px; }
    .feed::-webkit-scrollbar-track { background: transparent; }
    .feed::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 999px;
      transition: background 180ms ease;
    }
    .feed:hover::-webkit-scrollbar-thumb,
    .feed:active::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.22); }

    .clip-item,
    .clip-row {
      position: relative;
      margin: 0;
      padding: 20px 8px 18px;
      border-bottom: 0.5px solid var(--hairline);
      border-radius: 12px;
      opacity: 0;
      transform: translateY(6px);
      animation: itemIn 260ms var(--ease-apple) var(--delay, var(--stagger, 0ms)) forwards;
      transition: background 180ms ease, opacity 180ms ease, transform 180ms var(--ease-apple);
    }

    .clip-item:last-child,
    .clip-row:last-child { border-bottom: 0; }
    .clip-item:hover, .clip-item:focus-within,
    .clip-row:hover, .clip-row:focus-within { background: var(--wash); }
    .clip-item.removing,
    .clip-row.removing { opacity: 0; transform: translateX(10px) scale(0.985); pointer-events: none; }

    @keyframes itemIn { to { opacity: 1; transform: translateY(0); } }

    .clip-quote,
    .quote-body {
      margin: 0 0 7px;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.55;
      letter-spacing: -0.012em;
      font-variant-numeric: tabular-nums;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .inline-citation,
    .mla-tag {
      color: var(--ink-secondary);
      font-weight: 500;
    }

    .clip-source,
    .source-caption {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink-secondary);
      font-size: 11.5px;
      line-height: 1.35;
    }

    .clip-actions,
    .inline-actions {
      height: 28px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin-top: 7px;
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity 180ms var(--ease-apple), transform 180ms var(--ease-apple);
    }

    .clip-item:hover .clip-actions,
    .clip-item:focus-within .clip-actions,
    .clip-row:hover .inline-actions,
    .clip-row:focus-within .inline-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .pill-action,
    .action-pill {
      appearance: none;
      border: none;
      background: var(--pill-bg);
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.005em;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition:
        background-color 180ms var(--ease-spring),
        color 180ms var(--ease-spring),
        transform 110ms var(--ease-press);
    }

    .pill-action:hover,
    .action-pill:hover {
      background: var(--pill-bg-hover);
      color: var(--ink);
    }

    .pill-action:active,
    .action-pill:active {
      transform: scale(0.95);
    }

    .pill-action.is-danger:hover,
    .action-pill.is-danger:hover,
    .action-pill.del:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* Inline Pill Icon Morph (Copy -> Checkmark) */
    .pill-icon-stack {
      position: relative;
      width: 11px;
      height: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pill-icon-stack svg {
      position: absolute;
      inset: 0;
      width: 11px;
      height: 11px;
      stroke: currentColor;
      stroke-width: 1.55;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pill-icon-default {
      opacity: 1;
      transform: scale(1);
      transition:
        opacity 160ms var(--ease-spring),
        transform 200ms var(--ease-spring);
    }

    .pill-icon-check {
      opacity: 0;
      transform: scale(0.6);
      transition:
        opacity 160ms var(--ease-spring),
        transform 220ms var(--ease-spring);
    }

    .pill-icon-check path {
      stroke-dasharray: 16;
      stroke-dashoffset: 16;
      transition: stroke-dashoffset 240ms var(--ease-spring) 35ms;
    }

    /* Fixed-width label stack so pill buttons never resize */
    .pill-label-stack {
      display: inline-grid;
      align-items: center;
      justify-items: center;
    }

    .pill-label-stack > span {
      grid-area: 1 / 1;
      white-space: nowrap;
      transition:
        opacity 160ms var(--ease-spring),
        transform 180ms var(--ease-spring);
    }

    .pill-label-copied {
      opacity: 0;
      transform: translateY(2px);
    }

    /* Confirmed Copied State (Champagne Gold, zero glow) */
    .pill-action.is-copied,
    .action-pill.is-copied {
      background: #B48A3E;
      color: #fbfbfd;
    }

    .pill-action.is-copied .pill-icon-default,
    .action-pill.is-copied .pill-icon-default {
      opacity: 0;
      transform: scale(0.6);
    }

    .pill-action.is-copied .pill-icon-check,
    .action-pill.is-copied .pill-icon-check {
      opacity: 1;
      transform: scale(1);
    }

    .pill-action.is-copied .pill-icon-check path,
    .action-pill.is-copied .pill-icon-check path {
      stroke-dashoffset: 0;
    }

    .pill-action.is-copied .pill-label-default,
    .action-pill.is-copied .pill-label-default {
      opacity: 0;
      transform: translateY(-2px);
    }

    .pill-action.is-copied .pill-label-copied,
    .action-pill.is-copied .pill-label-copied {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state,
    .empty-view {
      padding: 72px 24px;
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
      animation: itemIn 260ms var(--ease-apple) forwards;
    }

    .empty-title,
    .empty-heading { margin: 0 0 7px; font-size: 13.5px; font-weight: 600; }
    .empty-sub,
    .empty-copy { margin: 0; color: var(--ink-secondary); font-size: 12px; line-height: 1.5; }

    .kbd,
    .key-cap {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--pill);
      color: var(--ink);
      font-size: 10.5px;
    }

    .bottom-dock {
      position: relative;
      z-index: 12;
      display: flex;
      justify-content: flex-end;
      padding: 8px 16px 12px;
      background: var(--dock);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }

    .primary-pill-cta {
      pointer-events: auto;
      appearance: none;
      border: none;
      background: var(--cta-bg);
      color: var(--cta-ink);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition:
        background-color 220ms var(--ease-spring),
        color 220ms var(--ease-spring),
        transform 160ms var(--ease-spring);
    }

    .primary-pill-cta:hover {
      background: #B48A3E;
      color: #fbfbfd;
      transform: translateY(-1px);
    }

    .primary-pill-cta:active {
      transform: translateY(0) scale(0.955);
      transition-duration: 100ms;
    }

    /* Icon stack for smooth Copy -> Checkmark morph */
    .cta-icon-stack {
      position: relative;
      width: 13px;
      height: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cta-icon-stack svg {
      position: absolute;
      inset: 0;
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 1.65;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-copy .sheet-front,
    .icon-copy .sheet-back {
      transition: transform 240ms var(--ease-spring);
      transform-box: fill-box;
      transform-origin: center;
    }

    .primary-pill-cta:hover:not(.is-copied) .icon-copy .sheet-front {
      transform: translate(0.8px, 0.8px);
    }

    .primary-pill-cta:hover:not(.is-copied) .icon-copy .sheet-back {
      transform: translate(-0.8px, -0.8px);
    }

    .icon-copy {
      opacity: 1;
      transform: scale(1);
      transition:
        opacity 180ms var(--ease-spring),
        transform 220ms var(--ease-spring);
    }

    .icon-check {
      opacity: 0;
      transform: scale(0.6);
      transition:
        opacity 180ms var(--ease-spring),
        transform 240ms var(--ease-spring);
    }

    .icon-check path {
      stroke-dasharray: 16;
      stroke-dashoffset: 16;
      transition: stroke-dashoffset 260ms var(--ease-spring) 40ms;
    }

    /* Fixed-width label stack so pill never shrinks on click */
    .cta-label-stack {
      display: inline-grid;
      align-items: center;
      justify-items: center;
    }

    .cta-label-stack > span {
      grid-area: 1 / 1;
      white-space: nowrap;
      transition:
        opacity 180ms var(--ease-spring),
        transform 200ms var(--ease-spring);
    }

    .label-copied {
      opacity: 0;
      transform: translateY(3px);
    }

    /* Confirmed Copied State */
    .primary-pill-cta.is-copied {
      background: #B48A3E;
      color: #fbfbfd;
    }

    .primary-pill-cta.is-copied .icon-copy {
      opacity: 0;
      transform: scale(0.6);
    }

    .primary-pill-cta.is-copied .icon-check {
      opacity: 1;
      transform: scale(1);
    }

    .primary-pill-cta.is-copied .icon-check path {
      stroke-dashoffset: 0;
    }

    .primary-pill-cta.is-copied .label-default {
      opacity: 0;
      transform: translateY(-3px);
    }

    .primary-pill-cta.is-copied .label-copied {
      opacity: 1;
      transform: translateY(0);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 58px;
      z-index: 30;
      transform: translate(-50%, 8px) scale(0.94);
      opacity: 0;
      max-width: calc(100% - 32px);
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(24, 24, 27, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fafafa;
      font-size: 11.5px;
      font-weight: 550;
      white-space: nowrap;
      pointer-events: none;
      transition: transform 220ms var(--ease-apple), opacity 180ms ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .day-copy-btn,
      .primary-pill-cta,
      .icon-copy,
      .icon-check,
      .icon-check path,
      .icon-copy .sheet-front,
      .icon-copy .sheet-back,
      .cta-label-stack > span,
      .pill-icon-default,
      .pill-icon-check,
      .pill-icon-check path,
      .pill-label-stack > span,
      .cite-quotes path,
      .snap-word,
      #clearBtn .trash-lid,
      #clearBtn .trash-can {
        transition-duration: 0.01ms !important;
      }
      .app, .clip-item, .empty-state { animation: none !important; opacity: 1 !important; transform: none !important; }
      .clip-actions, .toast, .search-input, .ghost-action, .ghost-btn, .action-pill, .pill-action, .primary-pill-cta { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-lockup" aria-label="CiteSnap">
          <span class="cite-word">
            <svg class="cite-quotes" viewBox="0 0 16 14" fill="currentColor" aria-hidden="true">
              <path class="q-first" d="M5.2 2C2.9 2 1.2 3.7 1.2 6.2V11c0 1 .8 1.8 1.8 1.8h2.6c1 0 1.8-.8 1.8-1.8V8.2c0-1-.8-1.8-1.8-1.8H3.8c0-1.7.9-2.6 2.4-2.9.4-.1.7-.4.7-.8v-.4c0-.5-.4-.8-.9-.8-.3.5-.5.5-.8.5z" />
              <path class="q-second" d="M13.2 2c-2.3 0-4 1.7-4 4.2V11c0 1 .8 1.8 1.8 1.8h2.6c1 0 1.8-.8 1.8-1.8V8.2c0-1-.8-1.8-1.8-1.8h-1.8c0-1.7.9-2.6 2.4-2.9.4-.1.7-.4.7-.8v-.4c0-.5-.4-.8-.9-.8-.3.5-.5.5-.8.5z" />
            </svg>
            Cite
          </span><span class="snap-word">Snap</span>
        </h1>
        <span id="clipCount" class="count-pill">0 clips</span>
      </div>

      <div class="header-actions">
        <button id="clearBtn" type="button" class="ghost-action danger" title="Clear all saved clips" aria-label="Clear all saved clips">
          <svg class="svg-icon" viewBox="0 0 16 16" aria-hidden="true">
            <g class="trash-lid">
              <path d="M2.8 4.8h10.4" />
              <path d="M6.2 4.8V3.3c0-.4.3-.8.8-.8h2c.5 0 .8.4.8.8v1.5" />
            </g>
            <g class="trash-can">
              <path d="M4.6 4.8l.7 7.9c.1.5.5.8 1 .8h3.4c.5 0 .9-.3 1-.8l.7-7.9" />
            </g>
          </svg>
          <span>Clear</span>
        </button>
      </div>

      <div class="search-row">
        <label class="search-pill" for="searchInput">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" />
            <path d="M10.5 10.5L13.5 13.5" />
          </svg>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search clips…"
            autocomplete="off"
            aria-label="Search clips"
          />
        </label>

        <div id="collectionDropdown" class="collection-dropdown">
          <button
            id="dropdownTrigger"
            type="button"
            class="dropdown-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            title="Switch project"
          >
            <span id="dropdownLabel" class="dropdown-label">General</span>
            <svg class="dropdown-chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4.5 6.5L8 10l3.5-3.5" />
            </svg>
          </button>

          <div id="dropdownMenu" class="dropdown-menu" role="listbox" aria-label="Projects"></div>
        </div>
      </div>
    </header>

    <main id="feed" class="feed" aria-live="polite"></main>

    <div class="bottom-dock">
      <button id="copyAllBtn" type="button" class="primary-pill-cta">
        <span class="cta-icon-stack" aria-hidden="true">
          <svg class="icon-copy" viewBox="0 0 16 16">
            <path class="sheet-back" d="M3.5 10.5V4a1.5 1.5 0 0 1 1.5-1.5h5" />
            <rect class="sheet-front" x="5.2" y="5.2" width="7.3" height="8.3" rx="1.5" />
          </svg>
          <svg class="icon-check" viewBox="0 0 16 16">
            <path d="M3.5 8.4l3 3 6-6.4" />
          </svg>
        </span>
        <span class="cta-label-stack">
          <span class="label-default">Copy Works Cited</span>
          <span class="label-copied" aria-hidden="true">Copied</span>
        </span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
